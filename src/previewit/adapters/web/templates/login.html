{% extends "base.html" %}
{% block content %}
<section class="card auth-card">
  <h1>Log in</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  {% include "_providers.html" %}
  <form method="post" action="/login" hx-boost="false" class="form">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">Email
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required>
    </label>
    <label class="field">Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p>New here? <a href="/signup?next={{ next | urlencode }}">Create an account</a></p>
</section>
{% endblock %}
