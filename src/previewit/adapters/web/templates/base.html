<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="{{ url_for('static', path='js/htmx.min.js') }}" defer></script>
</head>
<body hx-boost="true">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-dot" aria-hidden="true"></span>Previewit</a>
    <nav aria-label="Main">
      {% if request.state.user %}<a href="/account">Account</a>
      {% else %}<a href="/login">Log in</a> <a href="/signup">Sign up</a>{% endif %}
    </nav>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="footer">
    <a href="{{ source_url }}">Source code</a> · AGPL-3.0-or-later
  </footer>
</body>
</html>
