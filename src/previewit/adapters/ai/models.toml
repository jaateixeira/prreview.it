# The AI models Previewit offers for AI reviews (ADR 0025).
#
# Prices are US dollars per million tokens, copied from each service's own price page on the
# date in `checked`. Prices change often: check them every month and before any change to
# what Previewit charges. Models are listed in this order under "See more"; free models on
# Previewit's own server come first, and the suggestion rules pick three (domain/ai_models.py).
#
# context:        the most tokens the model reads and writes in one go AT THE PRICE GIVEN
#                 (several services charge more for very long prompts; we stay below that)
# max_output:     the most it may write, thinking included
# typical_output: what a review usually takes, thinking included; used for "about" prices
# tier:           3 among the strongest, 2 strong, 1 light
# hosted_in:      ISO 3166 country code of where the service runs it; "" when it varies

# -- the services: who runs the models and takes the key ----------------------------------------

[services.anthropic]
name = "Anthropic"
api = "anthropic"
url = "https://api.anthropic.com/v1/messages"
key_label = "Anthropic API key"
key_url = "https://console.anthropic.com/settings/keys"
hosted_in = "US"
hosting = "Anthropic, USA"
prices = "https://docs.claude.com/en/docs/about-claude/pricing"

[services.openai]
name = "OpenAI"
api = "openai"
url = "https://api.openai.com/v1/chat/completions"
max_tokens_field = "max_completion_tokens"
key_label = "OpenAI API key"
key_url = "https://platform.openai.com/api-keys"
hosted_in = "US"
hosting = "OpenAI, USA"
prices = "https://developers.openai.com/api/docs/pricing"

[services.google]
name = "Google"
api = "openai"
url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
key_label = "Gemini API key"
key_url = "https://aistudio.google.com/apikey"
hosted_in = "US"
hosting = "Google, USA"
prices = "https://ai.google.dev/gemini-api/docs/pricing"

[services.mistral]
name = "Mistral AI"
api = "openai"
url = "https://api.mistral.ai/v1/chat/completions"
key_label = "Mistral API key"
key_url = "https://console.mistral.ai/api-keys"
hosted_in = "FR"
hosting = "Mistral AI, France"
prices = "https://mistral.ai/pricing"

[services.xai]
name = "xAI"
api = "openai"
url = "https://api.x.ai/v1/chat/completions"
key_label = "xAI API key"
key_url = "https://console.x.ai"
hosted_in = "US"
hosting = "xAI, USA"
prices = "https://docs.x.ai/docs/pricing"

[services.deepseek]
name = "DeepSeek"
api = "openai"
url = "https://api.deepseek.com/chat/completions"
key_label = "DeepSeek API key"
key_url = "https://platform.deepseek.com/api_keys"
hosted_in = "CN"
hosting = "DeepSeek, China"
prices = "https://api-docs.deepseek.com/quick_start/pricing"

[services.huggingface]
name = "Hugging Face"
api = "openai"
url = "https://router.huggingface.co/v1/chat/completions"
key_label = "Hugging Face token"
key_url = "https://huggingface.co/settings/tokens"
hosted_in = ""
hosting = "Hugging Face's partners (the cheapest one at the time)"
prices = "https://huggingface.co/inference/models"

