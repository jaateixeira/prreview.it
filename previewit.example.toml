# Previewit configuration. Copy to previewit.toml (or /etc/previewit/previewit.toml),
# or point PREVIEWIT_CONFIG at it. PREVIEWIT_* environment variables override this file.
# Secrets live here, so keep the file private: chmod 600 previewit.toml
# Relative file paths are relative to this file.

[server]
base_url = "https://peerview.example"       # https requires a secret key
# secret_key = "…"                         # openssl rand -hex 32
# secret_key_file = "secret.key"           # alternative: read it from a file
# Other addresses of this site. Visitors who arrive there are sent to base_url.
# aliases = ["https://peereview.example", "https://www.peerview.example"]

[database]
url = "postgresql+psycopg://previewit:password@localhost/previewit"

[cache]
# Valkey keeps the signed-in user close at hand. Without it an in-process cache is used,
# which is right for one worker only.
# url = "valkey://127.0.0.1:6379/0"

[ai]
# AI reviews (ADR 0025). People choose AI models to review their work and give their own key
# for the paid ones; the key is used once and never stored. The free models are the ones
# installed on your own Ollama server; leave ollama_url out to offer none.
# enabled = true
# ollama_url = "http://10.0.0.7:11434"     # a machine on your network, never the internet
# local_place = "Finland"                  # where that server is, shown with a flag
# local_country = "FI"
# local_context = 8192                     # tokens a local model reads and writes in one go
# local_models = ["qwen3:8b", "gemma3:12b"]  # offer only these; leave out to offer all
# margin_percent = 30                      # on top of a service's price when Previewit pays

[logging]
level = "INFO"                             # TRACE | DEBUG | INFO | WARNING | ERROR

[mail]
# smtp_host = "smtp.example.org"
# smtp_port = 587
# smtp_user = "…"
# smtp_password = "…"
# smtp_security = "starttls"               # starttls | ssl | none
# from = "Previewit <no-reply@peerview.example>"

# --- Email verification: which actions need a verified email address -------------------
# Actions: create_organization, invite, join, submit, review.
# Unverified users can always be invited and can always sign in; this only gates the actions
# you list. The default (below) gates nothing: invited reviewers can even review without an
# account and are invited to join afterwards (ADR 0020). Listing "review" or "join" turns
# that off: reviewers then need an account with a confirmed email.
[policy]
require_verified_email_for = []

