# Install once with `make hooks`. Hooks use the project's own tools through uv.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: layers
        name: import-linter (layering)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
