[project]
name = "previewit"
version = "0.0.1"
description = "Fast, friendly, open-source peer review for any organization."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Previewit contributors" }]
keywords = ["peer review", "education", "htmx", "fastapi"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "authlib>=1.9.5",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1",
    "joserfc>=1.8.0",
    "loguru>=0.8.0",
    "python-multipart>=0.0.33",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
saml = [
    "pysaml2>=7.5.5",
]
postgres = [
    "psycopg[binary]>=3.2",
]
valkey = [
    "valkey>=6.0",
]

[project.entry-points."previewit.plugins"]
text = "previewit.plugins.text:TextArtifact"
pdf = "previewit.plugins.pdf:PdfArtifact"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-playwright>=0.5",
    "httpx>=0.27",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/previewit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["acceptance: browser-based end-to-end tests (Playwright)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
strict = ["src/previewit/domain"]

[tool.importlinter]
root_package = "previewit"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layering: adapters -> application -> domain"
type = "layers"
layers = ["previewit.bootstrap", "previewit.adapters", "previewit.application", "previewit.domain"]

[[tool.importlinter.contracts]]
name = "Domain is pure (no framework imports)"
type = "forbidden"
source_modules = ["previewit.domain", "previewit.application"]
forbidden_modules = ["fastapi", "starlette", "jinja2", "sqlalchemy", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Plugins use the application and domain only"
type = "forbidden"
source_modules = ["previewit.plugins"]
forbidden_modules = ["previewit.adapters", "previewit.bootstrap"]
